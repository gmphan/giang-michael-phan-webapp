services:
  postgres:
    image: postgres:16
    container_name: local_postgres
    restart: always
    env_file:
      - variables.prd.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  webapp:
    image: ghcr.io/gmphan/gmphan-webapp:latest
    container_name: gmphan_webapp_prd
    restart: always
    env_file:
      - variables.prd.env
    ports:
      - "8081:80"
    depends_on:
      - postgres

volumes:
  postgres_data:

