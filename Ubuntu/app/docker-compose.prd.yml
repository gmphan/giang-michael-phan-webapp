services:
  postgres:
    image: postgres:16
    container_name: local_postgres
    restart: always
    env_file:
      - variables.prd.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  webapp:
    image: ghcr.io/gmphan/gmphan-webapp:latest
    container_name: gmphan_webapp_prd
    restart: always
    env_file:
      - variables.prd.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/https
    depends_on:
      - postgres

  ddns-updater:
    image: qmcgaw/ddns-updater
    container_name: ddns_updater
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ddns-data:/updater/data

volumes:
  postgres_data:
